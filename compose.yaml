name: smartschool-md01
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?Run pnpm setup}:${POSTGRES_PASSWORD:?Run pnpm setup}@postgres:5432/${POSTGRES_DB:?Run pnpm setup}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  API_PORT: 3333
  WEB_ORIGIN: ${WEB_ORIGIN}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run setup for MD-02}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  init:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: build
    environment: *app-environment
    command: ["sh", "-c", "pnpm db:migrate && node scripts/init.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment: *app-environment
    ports: ["127.0.0.1:3333:3333"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 12
    init: true
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  minio-data:
