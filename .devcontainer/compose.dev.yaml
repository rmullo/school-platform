services:
  dev:
    container_name: smartschool-development
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: dev
    volumes:
      - .:/workspace:cached
      - dev-node-modules:/workspace/node_modules
      - dev-api-modules:/workspace/apps/api/node_modules
      - dev-web-modules:/workspace/apps/web/node_modules
      - dev-contracts-modules:/workspace/packages/contracts/node_modules
      - dev-database-modules:/workspace/packages/database/node_modules
      - dev-storage-modules:/workspace/packages/storage/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://file-storage:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      API_PORT: 3333
      WEB_ORIGIN: http://localhost:5173
      API_PROXY_TARGET: http://localhost:3333
      LOG_LEVEL: info
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run setup for MD-02}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      database: { condition: service_healthy }
      file-storage: { condition: service_healthy }
  school-api:
    profiles: [full-stack]
  school-web:
    profiles: [full-stack]
  environment-initializer:
    profiles: [full-stack]
volumes:
  dev-node-modules:
  dev-api-modules:
  dev-web-modules:
  dev-contracts-modules:
  dev-database-modules:
  dev-storage-modules:
